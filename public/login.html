<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · TIM-AI</title>
<link rel="icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem('timai.theme');if(t)document.documentElement.dataset.theme=t;if(localStorage.getItem('timai.sb')==='1')document.documentElement.classList.add('sb-collapsed')}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
  <style>
    .login { max-width: 360px; margin: 12vh auto; }
    .login .brand { justify-content: center; margin-bottom: 18px; }
    .login a.btn.google-btn { display: flex; box-sizing: border-box; font-weight: 600; align-items: center; justify-content: center; gap: 10px; width: 100%; text-decoration: none; }
    .google-btn svg { width: 18px; height: 18px; flex: none; }
    .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 14px 0 4px; }
    .or::before, .or::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <form class="card login" id="login-form">
      <div class="brand"><img class="logo logo-img" src="/logo.svg" alt=""> TIM-AI</div>
      <div id="google-box" hidden>
        <a class="btn big google-btn" id="google-login" href="/api/auth/google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Masuk dengan Google</a>
        <p class="hint">Pakai akun Google yang emailnya sudah didaftarkan admin. Akun yang sama dipakai untuk Gemini.</p>
        <div class="or">atau pakai username</div>
      </div>
      <input id="username" placeholder="Username" autocomplete="username" autocapitalize="none" autofocus>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <div id="login-error" class="error" hidden></div>
      <button class="primary big" type="submit">Masuk</button>
      <p class="hint" style="text-align:center"><a href="/privacy.html">Kebijakan Privasi</a></p>
    </form>
  </main>
  <script type="module">
    const form = document.getElementById('login-form');
    const err = document.getElementById('login-error');
    const params = new URLSearchParams(location.search);
    const showError = (msg) => { err.textContent = msg; err.hidden = false; };
    if (params.get('error')) showError(params.get('error'));
    // Balik dari Google: id_token ada di fragment URL. Kirim ke server, lalu hapus dari address bar.
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get('id_token') || hash.get('error')) {
      history.replaceState(null, '', location.pathname + location.search);
      if (hash.get('error')) showError('Login Google dibatalkan.');
      else {
        fetch('/api/auth/google/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id_token: hash.get('id_token'), state: hash.get('state') }) })
          .then(async (r) => {
            const b = await r.json().catch(() => ({}));
            if (r.ok) location.href = /^\/(?!\/)[\w\-./]*$/.test(b.next || '') ? b.next : '/';
            else showError(b.error || 'Gagal masuk dengan Google');
          })
          .catch(() => showError('Gagal menghubungi server'));
      }
    }
    if (params.get('next')) document.getElementById('google-login').href = `/api/auth/google?next=${encodeURIComponent(params.get('next'))}`;
    fetch('/api/auth/google/config').then((r) => r.json()).then((c) => {
      if (!c.enabled) return;
      document.getElementById('google-box').hidden = false;
      document.getElementById('username').removeAttribute('autofocus');
    }).catch(() => {});
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      // Balik ke halaman asal (mis. /studio/) kalau ada, tapi cuma path di situs ini sendiri.
      const next = new URLSearchParams(location.search).get('next') || '';
      if (res.ok) return (location.href = /^\/(?!\/)[\w\-./]*$/.test(next) ? next : '/');
      err.textContent = (await res.json().catch(() => ({}))).error || 'Gagal masuk';
      err.hidden = false;
    });
  </script>
</body>
</html>
